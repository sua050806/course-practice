<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 현황</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; }
    .status { font-size: 22px; font-weight: bold; padding: 12px; border-radius: 8px; margin: 12px 0; text-align: center; }
    .status.closed { background: #eee; color: #555; }
    .status.waiting { background: #fff4d6; color: #a06b00; }
    .status.open { background: #dff5e1; color: #1e7b34; }
    .cards { display: flex; flex-wrap: wrap; gap: 8px; }
    .card { flex: 1; min-width: 130px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; text-align: center; }
    .card-value { font-size: 26px; font-weight: bold; }
    .card-label { font-size: 13px; color: #555; }
    /* 초당 요청 수 그래프: 막대 60개를 아래쪽에 맞춰 나란히 세움 */
    .chart { display: flex; align-items: flex-end; height: 160px; border-left: 1px solid #999; border-bottom: 1px solid #999; padding-top: 4px; }
    .chart-bar { flex: 1; margin: 0 1px; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
    .part-success { background: #2e9e4f; }
    .part-full { background: #d9534f; }
    .part-other { background: #aaa; }
    .chart-axis { display: flex; justify-content: space-between; font-size: 12px; color: #555; }
    .legend { font-size: 13px; margin-top: 4px; }
    .legend span { display: inline-block; width: 12px; height: 12px; margin: 0 4px 0 12px; vertical-align: middle; }
    .bar-row { display: flex; align-items: center; margin: 4px 0; font-size: 14px; }
    .bar-label { width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 18px; background: #4a7bd1; margin: 0 8px; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { border: 1px solid #ddd; text-align: center; padding: 4px; font-size: 13px; height: 28px; }
    .seat-track { width: 100%; height: 14px; background: #eee; }
    .seat-fill { height: 14px; background: #4a7bd1; }
    .seat-fill.closed-seat { background: #d9534f; }
    .closed-text { color: #c0392b; font-weight: bold; }
    .error { color: #c0392b; font-weight: bold; }
  </style>
</head>
<body>
  <h1>실시간 현황</h1>
  <p><a href="index.html">처음으로</a> · <a href="enroll.html">수강신청</a> · 1초마다 자동으로 갱신됩니다.</p>

  <!-- 신청 상태 -->
  <div id="status" class="status closed">상태 확인 중...</div>
  <div id="error-message" class="error"></div>

  <!-- 숫자 요약 -->
  <div class="cards">
    <div class="card"><div class="card-value" id="card-now">0</div><div class="card-label">직전 1초 요청 수</div></div>
    <div class="card"><div class="card-value" id="card-peak">0</div><div class="card-label">최근 60초 최고 (초당)</div></div>
    <div class="card"><div class="card-value" id="card-total">0</div><div class="card-label">누적 신청 요청</div></div>
    <div class="card"><div class="card-value" id="card-success">0</div><div class="card-label">누적 성공</div></div>
    <div class="card"><div class="card-value" id="card-full">0</div><div class="card-label">누적 정원 마감</div></div>
  </div>

  <!-- 초당 요청 수 그래프 -->
  <h2>초당 신청 요청 수 (최근 60초)</h2>
  <div id="chart" class="chart"></div>
  <div class="chart-axis"><span>60초 전</span><span>30초 전</span><span>지금</span></div>
  <div class="legend">
    <span class="part-success"></span>성공
    <span class="part-full"></span>정원 마감
    <span class="part-other"></span>그 외 (오픈 전, 중복 등)
  </div>

  <!-- 워커별 처리 건수 -->
  <h2>요청을 처리한 위치 (서버 / 워커)</h2>
  <div id="workers"></div>

  <!-- 과목별 남은 자리 -->
  <h2>과목별 남은 자리</h2>
  <div id="courses"></div>

  <script>
    var CHART_HEIGHT = 156;   // 그래프 막대의 최대 높이(px)

    // 서버에서 현황을 가져옴
    function loadStats() {
      fetch("/api/stats")
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          document.getElementById("error-message").textContent = "";
          renderStatus(data);
          renderCards(data);
          renderChart(data.seconds);
          renderWorkers(data.workers, data.totals.requests);
          renderCourses(data.courses);
        })
        .catch(function (error) {
          document.getElementById("error-message").textContent = "서버에 연결할 수 없습니다.";
        });
    }

    // 신청 상태 표시
    function renderStatus(data) {
      var statusBox = document.getElementById("status");
      if (data.state === "open") {
        statusBox.textContent = "신청 진행 중";
        statusBox.className = "status open";
      } else if (data.state === "waiting") {
        statusBox.textContent = "오픈까지 " + data.remainingSeconds + "초";
        statusBox.className = "status waiting";
      } else {
        statusBox.textContent = "신청 기간이 아닙니다";
        statusBox.className = "status closed";
      }
    }

    // 숫자 요약 표시
    function renderCards(data) {
      var seconds = data.seconds;

      // 마지막 칸(지금 이 순간의 1초)은 아직 다 지나지 않았으므로, 그 앞 칸을 "직전 1초"로 씀
      var lastFull = seconds[seconds.length - 2].requests;

      // 최근 60초 중 가장 요청이 많았던 1초
      var peak = 0;
      for (var i = 0; i < seconds.length; i++) {
        if (seconds[i].requests > peak) {
          peak = seconds[i].requests;
        }
      }

      document.getElementById("card-now").textContent = lastFull;
      document.getElementById("card-peak").textContent = peak;
      document.getElementById("card-total").textContent = data.totals.requests;
      document.getElementById("card-success").textContent = data.totals.success;
      document.getElementById("card-full").textContent = data.totals.full;
    }

    // 막대의 한 부분(성공 / 마감 / 그 외)을 만듦
    function createPart(className, count, maxCount) {
      var part = document.createElement("div");
      part.className = className;
      part.style.height = Math.round((count / maxCount) * CHART_HEIGHT) + "px";
      return part;
    }

    // 초당 요청 수 그래프: 1초에 막대 하나, 왼쪽이 60초 전이고 오른쪽이 지금
    function renderChart(seconds) {
      var chart = document.getElementById("chart");
      chart.innerHTML = "";

      // 가장 큰 값을 막대 최대 높이에 맞춤 (요청이 없을 때 0으로 나누지 않도록 최소 1)
      var maxCount = 1;
      for (var i = 0; i < seconds.length; i++) {
        if (seconds[i].requests > maxCount) {
          maxCount = seconds[i].requests;
        }
      }

      for (var j = 0; j < seconds.length; j++) {
        var second = seconds[j];
        var other = second.requests - second.success - second.full;

        var bar = document.createElement("div");
        bar.className = "chart-bar";
        // 마우스를 올리면 그 초의 숫자를 보여줌
        bar.title = second.secondsAgo + "초 전: 요청 " + second.requests + "건 (성공 " + second.success + ", 마감 " + second.full + ")";

        // 위에서부터 그 외, 마감, 성공 순으로 쌓음
        bar.appendChild(createPart("part-other", other, maxCount));
        bar.appendChild(createPart("part-full", second.full, maxCount));
        bar.appendChild(createPart("part-success", second.success, maxCount));
        chart.appendChild(bar);
      }
    }

    // 워커별 처리 건수: 요청이 워커들에게 나뉘어 처리되는 모습
    function renderWorkers(workers, totalRequests) {
      var area = document.getElementById("workers");
      area.innerHTML = "";

      if (workers.length === 0) {
        area.textContent = "아직 신청 요청이 없습니다.";
        return;
      }

      for (var i = 0; i < workers.length; i++) {
        var row = document.createElement("div");
        row.className = "bar-row";

        var label = document.createElement("span");
        label.className = "bar-label";
        label.textContent = workers[i].name;
        row.appendChild(label);

        // 막대 길이: 전체 요청 대비 비율 (최대 300px)
        var bar = document.createElement("div");
        bar.className = "bar";
        var width = 0;
        if (totalRequests > 0) {
          width = Math.round((workers[i].count / totalRequests) * 300);
        }
        bar.style.width = width + "px";
        row.appendChild(bar);

        var text = document.createElement("span");
        text.textContent = workers[i].count + "건";
        row.appendChild(text);

        area.appendChild(row);
      }
    }

    // 표에 칸 하나를 추가
    function appendCell(row, tagName, text) {
      var cell = document.createElement(tagName);
      cell.textContent = text;
      row.appendChild(cell);
      return cell;
    }

    // 과목별 남은 자리: 자리가 찬 만큼 막대가 채워지고, 마감되면 빨간색
    function renderCourses(courses) {
      var area = document.getElementById("courses");
      area.innerHTML = "";

      var table = document.createElement("table");
      var header = document.createElement("tr");
      appendCell(header, "th", "과목");
      appendCell(header, "th", "정원");
      appendCell(header, "th", "신청 인원");
      appendCell(header, "th", "남은 자리");
      appendCell(header, "th", "채워진 정도");
      table.appendChild(header);

      for (var i = 0; i < courses.length; i++) {
        var course = courses[i];
        var enrolled = course.capacity - course.remaining;

        var row = document.createElement("tr");
        appendCell(row, "td", course.name);
        appendCell(row, "td", course.capacity);
        appendCell(row, "td", enrolled);

        var remainingCell = appendCell(row, "td", course.remaining);
        if (course.remaining === 0) {
          remainingCell.textContent = "마감";
          remainingCell.className = "closed-text";
        }

        // 채워진 정도 막대
        var barCell = document.createElement("td");
        barCell.style.width = "40%";
        var track = document.createElement("div");
        track.className = "seat-track";
        var fill = document.createElement("div");
        fill.className = "seat-fill";
        if (course.remaining === 0) {
          fill.className = "seat-fill closed-seat";
        }
        fill.style.width = Math.round((enrolled / course.capacity) * 100) + "%";
        track.appendChild(fill);
        barCell.appendChild(track);
        row.appendChild(barCell);

        table.appendChild(row);
      }

      area.appendChild(table);
    }

    // 화면이 열리면 바로 한 번 불러오고, 이후 1초마다 갱신
    loadStats();
    setInterval(loadStats, 1000);
  </script>
</body>
</html>
