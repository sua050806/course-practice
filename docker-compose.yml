services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - flask

  flask:
    build: ./app
    environment:
      REDIS_HOST: redis
      # 관리자 키: .env 파일에 ADMIN_KEY=값 을 적으면 그 값을 쓰고, 없으면 admin1234
      ADMIN_KEY: ${ADMIN_KEY:-admin1234}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine