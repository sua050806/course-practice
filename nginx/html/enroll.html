<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수강신청</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 900px;
        margin: 0 auto;
        padding: 16px;
      }
      fieldset {
        margin-bottom: 16px;
      }
      .status {
        font-size: 22px;
        font-weight: bold;
        padding: 12px;
        border-radius: 8px;
        margin: 12px 0;
        text-align: center;
      }
      .status.closed {
        background: #eee;
        color: #555;
      }
      .status.waiting {
        background: #fff4d6;
        color: #a06b00;
      }
      .status.open {
        background: #dff5e1;
        color: #1e7b34;
      }
      .course-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid #eee;
      }
      .log {
        font-size: 14px;
        background: #f7f7f7;
        padding: 8px;
        border-radius: 6px;
        min-height: 40px;
      }
      .message {
        margin: 8px 0;
      }
      .success {
        color: #1e7b34;
      }
      .seat-info {
        font-size: 13px;
        color: #555;
        margin: 0 12px;
        white-space: nowrap;
      }
      .seat-info.seat-closed {
        color: #c0392b;
        font-weight: bold;
      }
      tr.my-course td {
        background: #fff9e0;
      }
      .closed-text {
        color: #c0392b;
        font-weight: bold;
      }
      .seat-track {
        width: 100%;
        height: 14px;
        background: #eee;
      }
      .seat-fill {
        height: 14px;
        background: #4a7bd1;
      }
      .seat-fill.closed-seat {
        background: #d9534f;
      }
      .error {
        color: #c0392b;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 8px;
      }
      th,
      td {
        border: 1px solid #ddd;
        text-align: center;
        padding: 4px;
        font-size: 13px;
        height: 28px;
      }
      td.filled {
        background: #dff5e1;
      }
    </style>
  </head>
  <body>
    <h1>수강신청</h1>
    <p>
      닉네임: <strong id="nickname-label"></strong> ·
      <a href="index.html">처음으로</a> · <a href="cart.html">장바구니</a>
    </p>

    <!-- 신청 상태 표시: 1초마다 갱신 -->
    <div id="status" class="status closed">상태 확인 중...</div>

    <!-- 장바구니 과목과 신청 버튼 -->
    <h2>장바구니 과목</h2>
    <button id="enroll-all-btn" class="enroll-btn" disabled>
      장바구니 전체 신청
    </button>
    <div id="cart-list"></div>

    <!-- 과목별 신청 현황: 모든 과목의 신청 인원과 남은 자리 (1초마다 갱신) -->
    <h2>과목별 신청 현황</h2>
    <p>
      전체 과목의 신청 인원과 남은 자리입니다. 노란 줄은 내 장바구니 과목입니다.
    </p>
    <div id="seat-board"></div>

    <!-- 신청 결과 기록 -->
    <h2>신청 결과</h2>
    <div id="log" class="log"></div>

    <!-- 신청 내역 -->
    <h2>신청 내역 (<span id="enrolled-credit">0</span>학점)</h2>
    <div id="my-timetable"></div>

    <script>
      var DAYS = ["월", "화", "수", "목", "금"];
      var MAX_PERIOD = 9;
      var NICKNAME_KEY = "nickname";

      // 신청 결과 코드를 화면에 보여줄 글자로 바꾸는 표
      var RESULT_LABELS = {
        success: "성공",
        full: "정원 마감",
        not_open: "오픈 전",
        duplicate: "중복 신청",
        conflict: "시간 겹침",
        credit_over: "학점 초과",
        invalid: "잘못된 요청",
        network_error: "연결 실패",
      };

      var isOpen = false; // 현재 신청 가능 여부
      var previousState = null; // 직전에 조회한 신청 상태 (상태가 바뀌었는지 확인용)
      var cartCourses = []; // 장바구니 과목 목록

      // 저장된 닉네임 읽기 (없으면 빈 문자열)
      function loadNickname() {
        try {
          var saved = localStorage.getItem(NICKNAME_KEY);
          if (saved === null) {
            return "";
          }
          return saved;
        } catch (error) {
          return "";
        }
      }

      // 닉네임이 없으면 입장 화면으로 돌려보냄
      // ?need=nickname을 붙여서 첫 화면에 "닉네임을 먼저 입력해야 합니다" 안내가 뜨게 함
      // replace를 쓰면 뒤로 가기를 눌러도 이 화면으로 다시 돌아오지 않음
      var nickname = loadNickname();
      if (nickname === "") {
        window.location.replace("index.html?need=nickname");
      }
      document.getElementById("nickname-label").textContent = nickname;

      // 서버에 요청을 보내고 { ok, data } 형태로 결과를 돌려줌
      function sendRequest(method, url, body) {
        var options = {
          method: method,
          headers: { "Content-Type": "application/json" },
        };
        if (body !== null) {
          options.body = JSON.stringify(body);
        }
        return fetch(url, options).then(function (response) {
          return response.json().then(function (data) {
            return { ok: response.ok, data: data };
          });
        });
      }

      // 결과 코드를 화면용 글자로 바꿈
      function getResultLabel(result) {
        if (RESULT_LABELS[result] !== undefined) {
          return RESULT_LABELS[result];
        }
        return result;
      }

      // 결과 기록 영역에 한 줄 추가 (최신 결과가 위로)
      function addLog(text, isSuccess) {
        var log = document.getElementById("log");
        var line = document.createElement("div");
        var now = new Date();
        line.textContent = "[" + now.toLocaleTimeString() + "] " + text;
        if (isSuccess) {
          line.className = "success";
        } else {
          line.className = "error";
        }
        log.insertBefore(line, log.firstChild);
      }

      // 과목 시간을 "월1-2, 수1" 같은 글자로 바꿈
      function formatTimes(times) {
        var parts = [];
        for (var i = 0; i < times.length; i++) {
          var slot = times[i];
          if (slot.start === slot.end) {
            parts.push(slot.day + slot.start);
          } else {
            parts.push(slot.day + slot.start + "-" + slot.end);
          }
        }
        return parts.join(", ");
      }

      // 특정 요일·교시에 수업이 있는 과목을 찾아 이름을 반환 (없으면 빈 문자열)
      function findCourseName(courses, day, period) {
        for (var i = 0; i < courses.length; i++) {
          var times = courses[i].times;
          for (var j = 0; j < times.length; j++) {
            if (
              times[j].day === day &&
              times[j].start <= period &&
              period <= times[j].end
            ) {
              return courses[i].name;
            }
          }
        }
        return "";
      }

      // 과목 목록을 요일 x 교시 표로 그림
      function createTimetable(courses) {
        var table = document.createElement("table");

        var headerRow = document.createElement("tr");
        var corner = document.createElement("th");
        corner.textContent = "교시";
        headerRow.appendChild(corner);
        for (var d = 0; d < DAYS.length; d++) {
          var dayHeader = document.createElement("th");
          dayHeader.textContent = DAYS[d];
          headerRow.appendChild(dayHeader);
        }
        table.appendChild(headerRow);

        for (var period = 1; period <= MAX_PERIOD; period++) {
          var row = document.createElement("tr");
          var periodCell = document.createElement("th");
          periodCell.textContent = period;
          row.appendChild(periodCell);

          for (var k = 0; k < DAYS.length; k++) {
            var cell = document.createElement("td");
            var name = findCourseName(courses, DAYS[k], period);
            if (name !== "") {
              cell.textContent = name;
              cell.className = "filled";
            }
            row.appendChild(cell);
          }
          table.appendChild(row);
        }
        return table;
      }

      // 신청 버튼들의 활성 상태를 오픈 여부에 맞춤
      function updateButtons() {
        var buttons = document.querySelectorAll(".enroll-btn");
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].disabled = !isOpen;
        }
      }

      // 신청 상태 조회 → 상태 표시와 버튼 갱신
      function loadStatus() {
        sendRequest("GET", "/api/status", null)
          .then(function (result) {
            var statusBox = document.getElementById("status");
            var data = result.data;

            if (data.state === "open") {
              statusBox.textContent = "신청 가능!";
              statusBox.className = "status open";
              isOpen = true;
            } else if (data.state === "waiting") {
              statusBox.textContent =
                "오픈까지 " + data.remainingSeconds + "초";
              statusBox.className = "status waiting";
              isOpen = false;
            } else {
              statusBox.textContent = "신청 기간이 아닙니다";
              statusBox.className = "status closed";
              isOpen = false;
            }
            updateButtons();

            // 상태가 바뀌면(오픈, 마감, 초기화 등) 장바구니와 신청 내역을 다시 불러옴
            if (previousState !== null && previousState !== data.state) {
              loadCart();
              loadMyEnrollments();
            }
            previousState = data.state;
          })
          .catch(function (error) {
            document.getElementById("status").textContent =
              "서버에 연결할 수 없습니다";
          });
      }

      // 장바구니 과목 목록을 신청 버튼과 함께 그림
      function renderCart(courses) {
        cartCourses = courses;
        var listArea = document.getElementById("cart-list");
        listArea.innerHTML = "";

        if (courses.length === 0) {
          listArea.innerHTML =
            '장바구니가 비어 있습니다. <a href="recommend.html">시간표 추천</a>이나 <a href="cart.html">장바구니</a>에서 과목을 담아주세요.';
          return;
        }

        for (var i = 0; i < courses.length; i++) {
          var course = courses[i];
          var row = document.createElement("div");
          row.className = "course-row";

          var label = document.createElement("span");
          label.textContent =
            course.name +
            " (" +
            course.credit +
            "학점, " +
            formatTimes(course.times) +
            ")";
          row.appendChild(label);

          // 신청 인원과 남은 자리 표시 칸 (내용은 loadSeats가 1초마다 채움)
          var seatInfo = document.createElement("span");
          seatInfo.className = "seat-info";
          seatInfo.id = "seat-" + course.id;
          row.appendChild(seatInfo);

          var button = document.createElement("button");
          button.textContent = "신청";
          button.className = "enroll-btn";
          button.disabled = !isOpen;
          button.addEventListener("click", makeEnrollHandler(course));
          row.appendChild(button);

          listArea.appendChild(row);
        }

        // 새로 그린 칸에 바로 숫자를 채움
        loadSeats();
      }

      // 과목이 내 장바구니에 있으면 true
      function isInCart(courseId) {
        for (var i = 0; i < cartCourses.length; i++) {
          if (cartCourses[i].id === courseId) {
            return true;
          }
        }
        return false;
      }

      // 표에 칸 하나를 추가
      function appendSeatCell(row, tagName, text) {
        var cell = document.createElement(tagName);
        cell.textContent = text;
        row.appendChild(cell);
        return cell;
      }

      // 과목별 신청 현황 표: 전체 과목의 정원, 신청 인원, 남은 자리
      function renderSeatBoard(courses) {
        var area = document.getElementById("seat-board");
        area.innerHTML = "";

        var table = document.createElement("table");
        var header = document.createElement("tr");
        appendSeatCell(header, "th", "과목");
        appendSeatCell(header, "th", "정원");
        appendSeatCell(header, "th", "신청 인원");
        appendSeatCell(header, "th", "남은 자리");
        appendSeatCell(header, "th", "채워진 정도");
        table.appendChild(header);

        for (var i = 0; i < courses.length; i++) {
          var course = courses[i];
          // 신청 인원 = 정원 - 남은 자리
          var enrolled = course.capacity - course.remaining;

          var row = document.createElement("tr");
          // 내 장바구니 과목은 노란 줄로 표시
          if (isInCart(course.id)) {
            row.className = "my-course";
          }

          appendSeatCell(row, "td", course.name);
          appendSeatCell(row, "td", course.capacity + "명");
          appendSeatCell(row, "td", enrolled + "명");

          var remainingCell = appendSeatCell(
            row,
            "td",
            course.remaining + "명",
          );
          if (course.remaining === 0) {
            remainingCell.textContent = "마감";
            remainingCell.className = "closed-text";
          }

          // 채워진 정도 막대 (마감되면 빨간색)
          var barCell = document.createElement("td");
          barCell.style.width = "35%";
          var track = document.createElement("div");
          track.className = "seat-track";
          var fill = document.createElement("div");
          fill.className = "seat-fill";
          if (course.remaining === 0) {
            fill.className = "seat-fill closed-seat";
          }
          fill.style.width =
            Math.round((enrolled / course.capacity) * 100) + "%";
          track.appendChild(fill);
          barCell.appendChild(track);
          row.appendChild(barCell);

          table.appendChild(row);
        }

        area.appendChild(table);
      }

      // 신청 인원과 남은 자리를 갱신 (1초마다 호출)
      // 전체 과목 현황 표와, 장바구니 과목 옆의 숫자를 함께 갱신
      function loadSeats() {
        sendRequest("GET", "/api/courses", null)
          .then(function (result) {
            if (!result.ok) {
              return;
            }
            renderSeatBoard(result.data);

            for (var i = 0; i < result.data.length; i++) {
              var course = result.data[i];
              // 장바구니에 없는 과목은 표시 칸이 없으므로 건너뜀
              var seatInfo = document.getElementById("seat-" + course.id);
              if (seatInfo === null) {
                continue;
              }

              // 신청 인원 = 정원 - 남은 자리
              var enrolled = course.capacity - course.remaining;
              if (course.remaining === 0) {
                seatInfo.textContent =
                  "신청 " +
                  enrolled +
                  "명 / 정원 " +
                  course.capacity +
                  "명 · 마감";
                seatInfo.className = "seat-info seat-closed";
              } else {
                seatInfo.textContent =
                  "신청 " +
                  enrolled +
                  "명 / 정원 " +
                  course.capacity +
                  "명 · 남은 자리 " +
                  course.remaining;
                seatInfo.className = "seat-info";
              }
            }
          })
          .catch(function (error) {
            // 다음 갱신 때 다시 시도하므로 따로 처리하지 않음
          });
      }

      // 장바구니 조회
      function loadCart() {
        sendRequest(
          "GET",
          "/api/cart?nickname=" + encodeURIComponent(nickname),
          null,
        ).then(function (result) {
          if (result.ok) {
            renderCart(result.data.courses);
          }
        });
      }

      // 신청 내역 조회 → 시간표 표시
      function loadMyEnrollments() {
        sendRequest(
          "GET",
          "/api/my?nickname=" + encodeURIComponent(nickname),
          null,
        ).then(function (result) {
          if (!result.ok) {
            return;
          }
          document.getElementById("enrolled-credit").textContent =
            result.data.totalCredit;
          var area = document.getElementById("my-timetable");
          area.innerHTML = "";
          area.appendChild(createTimetable(result.data.courses));
        });
      }

      // 신청 요청 하나를 보내고, 결과와 응답까지 걸린 시간을 돌려줌
      // requestNickname: 신청하는 사람의 닉네임
      function sendTimedEnroll(requestNickname, courseId) {
        var sentAt = performance.now();
        return sendRequest("POST", "/api/enroll", {
          nickname: requestNickname,
          courseId: courseId,
        })
          .then(function (response) {
            var item = {};
            item.courseId = courseId;
            item.ok = response.ok;
            item.result = response.data.result;
            item.message = response.data.message;
            item.server = response.data.server;
            item.workerPid = response.data.workerPid;
            item.sentAt = sentAt; // 요청을 보낸 시각
            item.elapsed = performance.now() - sentAt; // 응답까지 걸린 시간(ms)
            return item;
          })
          .catch(function (error) {
            // 연결 실패도 결과로 기록
            var item = {};
            item.courseId = courseId;
            item.ok = false;
            item.result = "network_error";
            item.message = "서버에 연결할 수 없습니다.";
            item.server = "-";
            item.workerPid = "-";
            item.sentAt = sentAt;
            item.elapsed = performance.now() - sentAt;
            return item;
          });
      }

      // 내가 과목 하나를 신청 → Promise 반환 (전체 신청에서 순서대로 쓰기 위해)
      function enrollCourse(course) {
        return sendTimedEnroll(nickname, course.id).then(function (item) {
          // 응답 시간(ms)과 처리한 워커 번호를 함께 표시
          addLog(
            course.name +
              ": " +
              item.message +
              " (" +
              Math.round(item.elapsed) +
              "ms, 워커 " +
              item.workerPid +
              ")",
            item.ok,
          );
          if (item.ok) {
            loadMyEnrollments();
          }
        });
      }

      // 반복문 안에서 버튼마다 자기 과목을 기억하도록 함수로 감싸서 반환
      function makeEnrollHandler(course) {
        return function () {
          enrollCourse(course);
        };
      }

      // 장바구니 전체 신청: 과목을 하나씩 순서대로 신청
      function enrollAll() {
        var index = 0;

        function next() {
          if (index >= cartCourses.length) {
            return;
          }
          var course = cartCourses[index];
          index = index + 1;
          enrollCourse(course).then(next);
        }

        next();
      }

      document
        .getElementById("enroll-all-btn")
        .addEventListener("click", enrollAll);

      // 화면이 열리면 상태·장바구니·신청 내역을 불러오고, 상태는 1초마다 갱신
      loadStatus();
      loadCart();
      loadMyEnrollments();
      loadSeats();
      setInterval(loadStatus, 1000);
      setInterval(loadSeats, 1000);
    </script>
  </body>
</html>
