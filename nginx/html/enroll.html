<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수강신청</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; }
    fieldset { margin-bottom: 16px; }
    .status { font-size: 22px; font-weight: bold; padding: 12px; border-radius: 8px; margin: 12px 0; text-align: center; }
    .status.closed { background: #eee; color: #555; }
    .status.waiting { background: #fff4d6; color: #a06b00; }
    .status.open { background: #dff5e1; color: #1e7b34; }
    .course-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; }
    .log { font-size: 14px; background: #f7f7f7; padding: 8px; border-radius: 6px; min-height: 40px; }
    .message { margin: 8px 0; }
    .success { color: #1e7b34; }
    .error { color: #c0392b; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { border: 1px solid #ddd; text-align: center; padding: 4px; font-size: 13px; height: 28px; }
    td.filled { background: #dff5e1; }
    .check-ok { color: #1e7b34; font-weight: bold; }
    .check-bad { color: #c0392b; font-weight: bold; }
    .bar-row { display: flex; align-items: center; margin: 4px 0; font-size: 14px; }
    .bar-label { width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 18px; background: #4a7bd1; margin: 0 8px; }
  </style>
</head>
<body>
  <h1>수강신청</h1>
  <p>닉네임: <strong id="nickname-label"></strong> · <a href="index.html">처음으로</a> · <a href="cart.html">장바구니</a></p>

  <!-- 신청 상태 표시: 1초마다 갱신 -->
  <div id="status" class="status closed">상태 확인 중...</div>

  <!-- 가상 경쟁자 설정: 신청이 열리면 내 장바구니 과목에 함께 신청하는 가상 사용자 -->
  <fieldset>
    <legend>가상 경쟁자와 연습</legend>
    <p>신청이 열리는 순간 가상 경쟁자들이 내 장바구니 과목에 신청을 시작합니다.</p>
    <label>가상 경쟁자 수(1~300): <input type="number" id="competitor-count" value="100" min="1" max="300"></label>
    <button id="arm-btn">경쟁자 대기시키기</button>
    <div id="competitor-message" class="message"></div>
  </fieldset>

  <!-- 장바구니 과목과 신청 버튼 -->
  <h2>장바구니 과목</h2>
  <button id="enroll-all-btn" class="enroll-btn" disabled>장바구니 전체 신청</button>
  <div id="cart-list"></div>

  <!-- 신청 결과 기록 -->
  <h2>신청 결과</h2>
  <div id="log" class="log"></div>

  <!-- 신청 내역 -->
  <h2>신청 내역 (<span id="enrolled-credit">0</span>학점)</h2>
  <div id="my-timetable"></div>

  <!-- 연습 결과: 경쟁자가 모두 끝나면 표시 -->
  <div id="practice-result"></div>

  <script>
    var DAYS = ["월", "화", "수", "목", "금"];
    var MAX_PERIOD = 9;
    var NICKNAME_KEY = "nickname";

    // 가상 경쟁자 설정값
    var MAX_COMPETITORS = 300;        // 경쟁자 최대 수
    var MAX_START_DELAY_MS = 5000;    // 경쟁자가 신청을 시작하는 가장 늦은 시점(오픈 후 ms)
    var MIN_GAP_MS = 200;             // 다음 과목을 신청하기까지 최소 간격(ms)
    var MAX_GAP_MS = 1000;            // 다음 과목을 신청하기까지 최대 간격(ms)

    // 신청 결과 코드를 화면에 보여줄 글자로 바꾸는 표
    var RESULT_LABELS = {
      success: "성공",
      full: "정원 마감",
      not_open: "오픈 전",
      duplicate: "중복 신청",
      conflict: "시간 겹침",
      credit_over: "학점 초과",
      invalid: "잘못된 요청",
      network_error: "연결 실패"
    };

    var isOpen = false;          // 현재 신청 가능 여부
    var previousState = null;    // 직전에 조회한 신청 상태 (상태가 바뀌었는지 확인용)
    var cartCourses = [];        // 장바구니 과목 목록
    var armed = false;           // 경쟁자가 대기 중인지
    var armedCount = 0;          // 대기 중인 경쟁자 수
    var practice = null;         // 진행 중이거나 끝난 연습 정보 (없으면 null)
    var practiceItems = [];      // 연습 중 보낸 모든 신청 요청의 기록 (나 + 경쟁자)

    // 저장된 닉네임 읽기 (없으면 빈 문자열)
    function loadNickname() {
      try {
        var saved = localStorage.getItem(NICKNAME_KEY);
        if (saved === null) {
          return "";
        }
        return saved;
      } catch (error) {
        return "";
      }
    }

    // 닉네임이 없으면 입장 화면으로 돌려보냄
    // ?need=nickname을 붙여서 첫 화면에 "닉네임을 먼저 입력해야 합니다" 안내가 뜨게 함
    // replace를 쓰면 뒤로 가기를 눌러도 이 화면으로 다시 돌아오지 않음
    var nickname = loadNickname();
    if (nickname === "") {
      window.location.replace("index.html?need=nickname");
    }
    document.getElementById("nickname-label").textContent = nickname;

    // 서버에 요청을 보내고 { ok, data } 형태로 결과를 돌려줌
    function sendRequest(method, url, body) {
      var options = { method: method, headers: { "Content-Type": "application/json" } };
      if (body !== null) {
        options.body = JSON.stringify(body);
      }
      return fetch(url, options).then(function (response) {
        return response.json().then(function (data) {
          return { ok: response.ok, data: data };
        });
      });
    }

    // 결과 코드를 화면용 글자로 바꿈
    function getResultLabel(result) {
      if (RESULT_LABELS[result] !== undefined) {
        return RESULT_LABELS[result];
      }
      return result;
    }

    // 결과 기록 영역에 한 줄 추가 (최신 결과가 위로)
    function addLog(text, isSuccess) {
      var log = document.getElementById("log");
      var line = document.createElement("div");
      var now = new Date();
      line.textContent = "[" + now.toLocaleTimeString() + "] " + text;
      if (isSuccess) {
        line.className = "success";
      } else {
        line.className = "error";
      }
      log.insertBefore(line, log.firstChild);
    }

    // 경쟁자 영역의 메시지 표시 (오류면 빨간색)
    function showCompetitorMessage(text, isError) {
      var area = document.getElementById("competitor-message");
      area.textContent = text;
      if (isError) {
        area.className = "message error";
      } else {
        area.className = "message";
      }
    }

    // 과목 시간을 "월1-2, 수1" 같은 글자로 바꿈
    function formatTimes(times) {
      var parts = [];
      for (var i = 0; i < times.length; i++) {
        var slot = times[i];
        if (slot.start === slot.end) {
          parts.push(slot.day + slot.start);
        } else {
          parts.push(slot.day + slot.start + "-" + slot.end);
        }
      }
      return parts.join(", ");
    }

    // 특정 요일·교시에 수업이 있는 과목을 찾아 이름을 반환 (없으면 빈 문자열)
    function findCourseName(courses, day, period) {
      for (var i = 0; i < courses.length; i++) {
        var times = courses[i].times;
        for (var j = 0; j < times.length; j++) {
          if (times[j].day === day && times[j].start <= period && period <= times[j].end) {
            return courses[i].name;
          }
        }
      }
      return "";
    }

    // 과목 목록을 요일 x 교시 표로 그림
    function createTimetable(courses) {
      var table = document.createElement("table");

      var headerRow = document.createElement("tr");
      var corner = document.createElement("th");
      corner.textContent = "교시";
      headerRow.appendChild(corner);
      for (var d = 0; d < DAYS.length; d++) {
        var dayHeader = document.createElement("th");
        dayHeader.textContent = DAYS[d];
        headerRow.appendChild(dayHeader);
      }
      table.appendChild(headerRow);

      for (var period = 1; period <= MAX_PERIOD; period++) {
        var row = document.createElement("tr");
        var periodCell = document.createElement("th");
        periodCell.textContent = period;
        row.appendChild(periodCell);

        for (var k = 0; k < DAYS.length; k++) {
          var cell = document.createElement("td");
          var name = findCourseName(courses, DAYS[k], period);
          if (name !== "") {
            cell.textContent = name;
            cell.className = "filled";
          }
          row.appendChild(cell);
        }
        table.appendChild(row);
      }
      return table;
    }

    // 신청 버튼들의 활성 상태를 오픈 여부에 맞춤
    function updateButtons() {
      var buttons = document.querySelectorAll(".enroll-btn");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].disabled = !isOpen;
      }
    }

    // 신청 상태 조회 → 상태 표시와 버튼 갱신, 열리는 순간 대기 중인 경쟁자 시작
    function loadStatus() {
      sendRequest("GET", "/api/status", null)
        .then(function (result) {
          var statusBox = document.getElementById("status");
          var data = result.data;

          if (data.state === "open") {
            statusBox.textContent = "신청 가능!";
            statusBox.className = "status open";
            isOpen = true;
          } else if (data.state === "waiting") {
            statusBox.textContent = "오픈까지 " + data.remainingSeconds + "초";
            statusBox.className = "status waiting";
            isOpen = false;
          } else {
            statusBox.textContent = "신청 기간이 아닙니다";
            statusBox.className = "status closed";
            isOpen = false;
          }
          updateButtons();

          // 신청이 열렸고 경쟁자가 대기 중이면 연습 시작
          if (isOpen && armed) {
            startPractice();
          }

          // 상태가 바뀌면(오픈, 마감, 초기화 등) 장바구니와 신청 내역을 다시 불러옴
          if (previousState !== null && previousState !== data.state) {
            loadCart();
            loadMyEnrollments();
          }
          previousState = data.state;
        })
        .catch(function (error) {
          document.getElementById("status").textContent = "서버에 연결할 수 없습니다";
        });
    }

    // 장바구니 과목 목록을 신청 버튼과 함께 그림
    function renderCart(courses) {
      cartCourses = courses;
      var listArea = document.getElementById("cart-list");
      listArea.innerHTML = "";

      if (courses.length === 0) {
        listArea.innerHTML = "장바구니가 비어 있습니다. <a href=\"recommend.html\">시간표 추천</a>이나 <a href=\"cart.html\">장바구니</a>에서 과목을 담아주세요.";
        return;
      }

      for (var i = 0; i < courses.length; i++) {
        var course = courses[i];
        var row = document.createElement("div");
        row.className = "course-row";

        var label = document.createElement("span");
        label.textContent = course.name + " (" + course.credit + "학점, " + formatTimes(course.times) + ")";
        row.appendChild(label);

        var button = document.createElement("button");
        button.textContent = "신청";
        button.className = "enroll-btn";
        button.disabled = !isOpen;
        button.addEventListener("click", makeEnrollHandler(course));
        row.appendChild(button);

        listArea.appendChild(row);
      }
    }

    // 장바구니 조회
    function loadCart() {
      sendRequest("GET", "/api/cart?nickname=" + encodeURIComponent(nickname), null)
        .then(function (result) {
          if (result.ok) {
            renderCart(result.data.courses);
          }
        });
    }

    // 신청 내역 조회 → 시간표 표시
    function loadMyEnrollments() {
      sendRequest("GET", "/api/my?nickname=" + encodeURIComponent(nickname), null)
        .then(function (result) {
          if (!result.ok) {
            return;
          }
          document.getElementById("enrolled-credit").textContent = result.data.totalCredit;
          var area = document.getElementById("my-timetable");
          area.innerHTML = "";
          area.appendChild(createTimetable(result.data.courses));
        });
    }

    // 신청 요청 하나를 보내고 결과를 기록 (나와 경쟁자가 함께 쓰는 함수)
    // requestNickname: 신청하는 사람의 닉네임, isMine: 내 요청이면 true
    function sendTimedEnroll(requestNickname, courseId, isMine) {
      var sentAt = performance.now();
      return sendRequest("POST", "/api/enroll", { nickname: requestNickname, courseId: courseId })
        .then(function (response) {
          var item = {};
          item.courseId = courseId;
          item.mine = isMine;
          item.ok = response.ok;
          item.result = response.data.result;
          item.message = response.data.message;
          item.server = response.data.server;
          item.workerPid = response.data.workerPid;
          item.sentAt = sentAt;                           // 요청을 보낸 시각
          item.elapsed = performance.now() - sentAt;      // 응답까지 걸린 시간(ms)
          // 연습 중이면 결과 집계를 위해 기록
          if (practice !== null) {
            practiceItems.push(item);
          }
          return item;
        })
        .catch(function (error) {
          // 연결 실패도 결과로 기록
          var item = {};
          item.courseId = courseId;
          item.mine = isMine;
          item.ok = false;
          item.result = "network_error";
          item.message = "서버에 연결할 수 없습니다.";
          item.server = "-";
          item.workerPid = "-";
          item.sentAt = sentAt;
          item.elapsed = performance.now() - sentAt;
          if (practice !== null) {
            practiceItems.push(item);
          }
          return item;
        });
    }

    // 내가 과목 하나를 신청 → Promise 반환 (전체 신청에서 순서대로 쓰기 위해)
    function enrollCourse(course) {
      return sendTimedEnroll(nickname, course.id, true).then(function (item) {
        // 응답 시간(ms)과 처리한 워커 번호를 함께 표시
        addLog(course.name + ": " + item.message + " (" + Math.round(item.elapsed) + "ms, 워커 " + item.workerPid + ")", item.ok);
        if (item.ok) {
          loadMyEnrollments();
        }
        // 경쟁자가 이미 끝난 뒤에 신청했다면 연습 결과를 다시 그림
        if (practice !== null && practice.finished) {
          renderPracticeResult();
        }
      });
    }

    // 반복문 안에서 버튼마다 자기 과목을 기억하도록 함수로 감싸서 반환
    function makeEnrollHandler(course) {
      return function () {
        enrollCourse(course);
      };
    }

    // 장바구니 전체 신청: 과목을 하나씩 순서대로 신청
    function enrollAll() {
      var index = 0;

      function next() {
        if (index >= cartCourses.length) {
          return;
        }
        var course = cartCourses[index];
        index = index + 1;
        enrollCourse(course).then(next);
      }

      next();
    }

    // ---------------- 가상 경쟁자 ----------------

    // min 이상 max 이하의 무작위 값
    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    // [경쟁자 대기시키기] 버튼: 대기 상태를 켜거나 끔
    function toggleArm() {
      var button = document.getElementById("arm-btn");

      // 이미 대기 중이면 취소
      if (armed) {
        armed = false;
        button.textContent = "경쟁자 대기시키기";
        showCompetitorMessage("대기를 취소했습니다.", false);
        return;
      }

      var count = Number(document.getElementById("competitor-count").value);
      if (!(count >= 1 && count <= MAX_COMPETITORS) || Math.floor(count) !== count) {
        showCompetitorMessage("가상 경쟁자 수는 1명 이상 300명 이하로 입력해주세요.", true);
        return;
      }

      if (cartCourses.length === 0) {
        showCompetitorMessage("장바구니가 비어 있습니다. 과목을 먼저 담아주세요.", true);
        return;
      }

      armed = true;
      armedCount = count;
      button.textContent = "대기 취소";
      showCompetitorMessage("가상 경쟁자 " + count + "명이 대기 중입니다. 신청이 열리면 함께 시작합니다.", false);

      // 이미 신청이 열려 있으면 바로 시작
      if (isOpen) {
        startPractice();
      }
    }

    // 경쟁자 한 명의 행동: 잠시 기다렸다가 과목을 하나씩 순서대로 신청
    // 모든 과목을 신청하면 끝나는 Promise를 반환
    function runCompetitor(competitorNickname, orderedCourses) {
      return new Promise(function (resolve) {
        var index = 0;

        function next() {
          if (index >= orderedCourses.length) {
            resolve();
            return;
          }
          var course = orderedCourses[index];
          index = index + 1;

          // 응답을 받은 뒤 0.2~1초 쉬고 다음 과목 신청 (사람이 다음 버튼을 누르는 간격)
          sendTimedEnroll(competitorNickname, course.id, false).then(function () {
            setTimeout(next, randomBetween(MIN_GAP_MS, MAX_GAP_MS));
          });
        }

        // 시작 시점: 무작위 값 두 개를 곱하면 작은 값이 더 자주 나옴
        // → 대부분 오픈 직후에 시작하고, 일부만 늦게 시작 (최대 5초)
        var startDelay = Math.random() * Math.random() * MAX_START_DELAY_MS;
        setTimeout(next, startDelay);
      });
    }

    // 연습 시작: 경쟁자들을 내 장바구니 과목에 신청시킴
    function startPractice() {
      armed = false;
      document.getElementById("arm-btn").textContent = "경쟁자 대기시키기";
      document.getElementById("practice-result").innerHTML = "";

      // 이번 연습 정보
      practiceItems = [];
      practice = {};
      practice.startAt = performance.now();   // 연습(오픈) 시작 시각
      practice.count = armedCount;            // 경쟁자 수
      practice.courses = cartCourses;         // 대상 과목 = 내 장바구니
      practice.beforeById = {};               // 연습 전 과목별 정원·남은 자리
      practice.finished = false;              // 경쟁자가 모두 끝났는지

      showCompetitorMessage("가상 경쟁자 " + practice.count + "명이 신청 중입니다...", false);

      // 연습 전 남은 자리를 조회한 뒤 경쟁자 시작
      sendRequest("GET", "/api/courses", null)
        .then(function (result) {
          for (var i = 0; i < result.data.length; i++) {
            practice.beforeById[result.data[i].id] = result.data[i];
          }

          // 경쟁자는 인기 과목(정원이 작은 과목)부터 신청
          var orderedCourses = practice.courses.slice();
          orderedCourses.sort(function (a, b) {
            return practice.beforeById[a.id].capacity - practice.beforeById[b.id].capacity;
          });

          // 연습마다 다른 닉네임을 쓰기 위한 번호 (예: t512-37)
          var runId = Math.floor(Math.random() * 1000);
          var competitors = [];
          for (var j = 1; j <= practice.count; j++) {
            competitors.push(runCompetitor("t" + runId + "-" + j, orderedCourses));
          }

          // 모든 경쟁자가 끝나면 결과 표시
          return Promise.all(competitors).then(function () {
            practice.finished = true;
            showCompetitorMessage("가상 경쟁자 " + practice.count + "명의 신청이 끝났습니다. 아래에서 연습 결과를 확인하세요.", false);
            renderPracticeResult();
          });
        })
        .catch(function (error) {
          showCompetitorMessage("서버에 연결할 수 없습니다: " + error, true);
        });
    }

    // ---------------- 연습 결과 ----------------

    // 표에 줄 하나를 추가 (cells: 칸에 넣을 글자 배열, tagName: th 또는 td)
    function appendRow(table, cells, tagName) {
      var tr = document.createElement("tr");
      for (var i = 0; i < cells.length; i++) {
        var cell = document.createElement(tagName);
        cell.textContent = cells[i];
        tr.appendChild(cell);
      }
      table.appendChild(tr);
      return tr;
    }

    // 제목 + 내용 묶음을 만듦
    function createSection(titleText) {
      var box = document.createElement("div");
      var title = document.createElement("h3");
      title.textContent = titleText;
      box.appendChild(title);
      return box;
    }

    // 막대 한 줄 (라벨, 막대, 값)
    function createBarRow(labelText, value, maxValue, valueText) {
      var row = document.createElement("div");
      row.className = "bar-row";

      var label = document.createElement("span");
      label.className = "bar-label";
      label.textContent = labelText;
      row.appendChild(label);

      // 막대 길이: 가장 큰 값 대비 비율 (최대 300px)
      var bar = document.createElement("div");
      bar.className = "bar";
      var width = 0;
      if (maxValue > 0) {
        width = Math.round((value / maxValue) * 300);
      }
      bar.style.width = width + "px";
      row.appendChild(bar);

      var text = document.createElement("span");
      text.textContent = valueText;
      row.appendChild(text);
      return row;
    }

    // 내 결과: 과목별로 내가 성공했는지, 오픈 후 몇 초 만에 응답을 받았는지
    function createMyResult() {
      var box = createSection("내 결과");
      var table = document.createElement("table");
      appendRow(table, ["과목", "결과", "오픈 후 걸린 시간", "처리 워커"], "th");

      for (var i = 0; i < practice.courses.length; i++) {
        var course = practice.courses[i];

        // 이 과목에 대한 내 마지막 신청 기록을 찾음
        var mine = null;
        for (var j = 0; j < practiceItems.length; j++) {
          if (practiceItems[j].mine && practiceItems[j].courseId === course.id) {
            mine = practiceItems[j];
          }
        }

        if (mine === null) {
          appendRow(table, [course.name, "신청 안 함", "-", "-"], "td");
        } else {
          // 오픈부터 응답을 받을 때까지 걸린 시간(초)
          var seconds = (mine.sentAt + mine.elapsed - practice.startAt) / 1000;
          var row = appendRow(table, [course.name, getResultLabel(mine.result), seconds.toFixed(1) + "초", mine.workerPid], "td");
          if (mine.result === "success") {
            row.children[1].className = "check-ok";
          } else {
            row.children[1].className = "check-bad";
          }
        }
      }

      box.appendChild(table);
      return box;
    }

    // 과목별 결과: 요청 수, 성공, 마감, 정원 검사
    function createCourseResult(afterById) {
      var box = createSection("과목별 결과 (나 + 가상 경쟁자 " + practice.count + "명)");
      var table = document.createElement("table");
      appendRow(table, ["과목", "정원", "연습 전 남은 자리", "신청 요청", "성공", "마감", "연습 후 남은 자리", "정원 검사"], "th");

      for (var i = 0; i < practice.courses.length; i++) {
        var course = practice.courses[i];
        var before = practice.beforeById[course.id];

        var requests = 0;
        var success = 0;
        var full = 0;
        for (var j = 0; j < practiceItems.length; j++) {
          var item = practiceItems[j];
          if (item.courseId === course.id) {
            requests = requests + 1;
            if (item.result === "success") {
              success = success + 1;
            }
            if (item.result === "full") {
              full = full + 1;
            }
          }
        }

        // 정원 검사: 성공한 수가 연습 전 남은 자리를 넘으면 정원 초과
        var checkText = "정상";
        var checkClass = "check-ok";
        if (success > before.remaining) {
          checkText = "정원 초과";
          checkClass = "check-bad";
        }

        var row = appendRow(table, [course.name, before.capacity, before.remaining, requests, success, full, afterById[course.id], checkText], "td");
        row.lastChild.className = checkClass;
      }

      box.appendChild(table);
      return box;
    }

    // 초 단위 요청 수와 평균 응답 시간: 오픈 직후에 요청이 몰리는 모습을 보여줌
    function createTimeline() {
      var box = createSection("시간대별 요청 수 (오픈 후)");

      // 요청을 보낸 시각을 오픈 후 몇 초대인지로 나눠서 집계
      var counts = [];
      var elapsedSums = [];
      for (var i = 0; i < practiceItems.length; i++) {
        var second = Math.floor((practiceItems[i].sentAt - practice.startAt) / 1000);
        if (second < 0) {
          second = 0;
        }
        while (counts.length <= second) {
          counts.push(0);
          elapsedSums.push(0);
        }
        counts[second] = counts[second] + 1;
        elapsedSums[second] = elapsedSums[second] + practiceItems[i].elapsed;
      }

      var maxCount = 0;
      for (var j = 0; j < counts.length; j++) {
        if (counts[j] > maxCount) {
          maxCount = counts[j];
        }
      }

      for (var k = 0; k < counts.length; k++) {
        var averageText = "-";
        if (counts[k] > 0) {
          averageText = Math.round(elapsedSums[k] / counts[k]) + "ms";
        }
        box.appendChild(createBarRow(k + "~" + (k + 1) + "초", counts[k], maxCount, counts[k] + "건 (평균 응답 " + averageText + ")"));
      }
      return box;
    }

    // 처리 위치(서버 / 워커)별 요청 수: 요청이 나뉘어 처리되는 모습을 보여줌
    function createDistribution() {
      var box = createSection("요청을 처리한 위치 (서버 / 워커)");

      var distribution = {};
      for (var i = 0; i < practiceItems.length; i++) {
        var place = practiceItems[i].server + " / 워커 " + practiceItems[i].workerPid;
        if (distribution[place] === undefined) {
          distribution[place] = 0;
        }
        distribution[place] = distribution[place] + 1;
      }

      for (var key in distribution) {
        box.appendChild(createBarRow(key, distribution[key], practiceItems.length, distribution[key] + "건"));
      }
      return box;
    }

    // 연습 결과 전체를 화면에 그림
    function renderPracticeResult() {
      // 연습 후 남은 자리를 조회해서 표에 함께 표시
      sendRequest("GET", "/api/courses", null).then(function (result) {
        var afterById = {};
        for (var i = 0; i < result.data.length; i++) {
          afterById[result.data[i].id] = result.data[i].remaining;
        }

        var area = document.getElementById("practice-result");
        area.innerHTML = "";

        var title = document.createElement("h2");
        title.textContent = "연습 결과 (전체 신청 요청 " + practiceItems.length + "건)";
        area.appendChild(title);

        area.appendChild(createMyResult());
        area.appendChild(createCourseResult(afterById));
        area.appendChild(createTimeline());
        area.appendChild(createDistribution());
      });
    }

    document.getElementById("enroll-all-btn").addEventListener("click", enrollAll);
    document.getElementById("arm-btn").addEventListener("click", toggleArm);

    // 화면이 열리면 상태·장바구니·신청 내역을 불러오고, 상태는 1초마다 갱신
    loadStatus();
    loadCart();
    loadMyEnrollments();
    setInterval(loadStatus, 1000);
  </script>
</body>
</html>
