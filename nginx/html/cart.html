<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장바구니</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; }
    .message { margin: 12px 0; font-weight: bold; }
    .error { color: #c0392b; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { border: 1px solid #ddd; text-align: center; padding: 4px; font-size: 13px; height: 28px; }
    td.filled { background: #dbe8ff; }
    .course-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>장바구니</h1>
  <p>닉네임: <strong id="nickname-label"></strong> · <a href="index.html">닉네임 변경</a> · <a href="recommend.html">시간표 추천</a></p>

  <!-- 처리 결과 메시지 -->
  <div id="message" class="message"></div>

  <!-- 장바구니 시간표와 과목 목록 -->
  <h2>내 장바구니 (<span id="total-credit">0</span>학점)</h2>
  <div id="cart-timetable"></div>
  <div id="cart-list"></div>

  <!-- 전체 과목 목록 -->
  <h2>전체 과목</h2>
  <div id="course-list"></div>

  <script>
    var DAYS = ["월", "화", "수", "목", "금"];
    var MAX_PERIOD = 9;
    var NICKNAME_KEY = "nickname";

    // 저장된 닉네임 읽기 (없으면 빈 문자열)
    function loadNickname() {
      try {
        var saved = localStorage.getItem(NICKNAME_KEY);
        if (saved === null) {
          return "";
        }
        return saved;
      } catch (error) {
        return "";
      }
    }

    // 닉네임이 없으면 입장 화면으로 돌려보냄
    var nickname = loadNickname();
    if (nickname === "") {
      window.location.href = "index.html";
    }
    document.getElementById("nickname-label").textContent = nickname;

    // 메시지 표시 (오류면 빨간색)
    function showMessage(text, isError) {
      var messageArea = document.getElementById("message");
      messageArea.textContent = text;
      if (isError) {
        messageArea.className = "message error";
      } else {
        messageArea.className = "message";
      }
    }

    // 과목 시간을 "월1-2, 수1" 같은 글자로 바꿈
    function formatTimes(times) {
      var parts = [];
      for (var i = 0; i < times.length; i++) {
        var time = times[i];
        if (time.start === time.end) {
          parts.push(time.day + time.start);
        } else {
          parts.push(time.day + time.start + "-" + time.end);
        }
      }
      return parts.join(", ");
    }

    // 특정 요일·교시에 수업이 있는 과목을 찾아 이름을 반환 (없으면 빈 문자열)
    function findCourseName(courses, day, period) {
      for (var i = 0; i < courses.length; i++) {
        var times = courses[i].times;
        for (var j = 0; j < times.length; j++) {
          if (times[j].day === day && times[j].start <= period && period <= times[j].end) {
            return courses[i].name;
          }
        }
      }
      return "";
    }

    // 과목 목록을 요일 x 교시 표로 그림
    function createTimetable(courses) {
      var table = document.createElement("table");

      var headerRow = document.createElement("tr");
      var corner = document.createElement("th");
      corner.textContent = "교시";
      headerRow.appendChild(corner);
      for (var d = 0; d < DAYS.length; d++) {
        var dayHeader = document.createElement("th");
        dayHeader.textContent = DAYS[d];
        headerRow.appendChild(dayHeader);
      }
      table.appendChild(headerRow);

      for (var period = 1; period <= MAX_PERIOD; period++) {
        var row = document.createElement("tr");
        var periodCell = document.createElement("th");
        periodCell.textContent = period;
        row.appendChild(periodCell);

        for (var k = 0; k < DAYS.length; k++) {
          var cell = document.createElement("td");
          var name = findCourseName(courses, DAYS[k], period);
          if (name !== "") {
            cell.textContent = name;
            cell.className = "filled";
          }
          row.appendChild(cell);
        }
        table.appendChild(row);
      }
      return table;
    }

    // 서버에 요청을 보내고 { ok, data } 형태로 결과를 돌려줌
    function sendRequest(method, url, body) {
      var options = { method: method, headers: { "Content-Type": "application/json" } };
      if (body !== null) {
        options.body = JSON.stringify(body);
      }
      return fetch(url, options).then(function (response) {
        return response.json().then(function (data) {
          return { ok: response.ok, data: data };
        });
      });
    }

    // 장바구니 화면(시간표, 목록, 총 학점)을 다시 그림
    function renderCart(cart) {
      document.getElementById("total-credit").textContent = cart.totalCredit;

      var timetableArea = document.getElementById("cart-timetable");
      timetableArea.innerHTML = "";
      timetableArea.appendChild(createTimetable(cart.courses));

      var listArea = document.getElementById("cart-list");
      listArea.innerHTML = "";

      if (cart.courses.length === 0) {
        listArea.textContent = "장바구니가 비어 있습니다.";
        return;
      }

      for (var i = 0; i < cart.courses.length; i++) {
        var course = cart.courses[i];
        var row = document.createElement("div");
        row.className = "course-row";

        var label = document.createElement("span");
        label.textContent = course.name + " (" + course.credit + "학점, " + formatTimes(course.times) + ")";
        row.appendChild(label);

        var removeButton = document.createElement("button");
        removeButton.textContent = "빼기";
        removeButton.addEventListener("click", makeRemoveHandler(course.id));
        row.appendChild(removeButton);

        listArea.appendChild(row);
      }
    }

    // 전체 과목 목록을 그림
    function renderCourseList(courses) {
      var listArea = document.getElementById("course-list");
      listArea.innerHTML = "";

      for (var i = 0; i < courses.length; i++) {
        var course = courses[i];
        var row = document.createElement("div");
        row.className = "course-row";

        var label = document.createElement("span");
        label.textContent = course.id + " " + course.name + " (" + course.credit + "학점, " + formatTimes(course.times) + ") 정원 " + course.capacity;
        row.appendChild(label);

        var addButton = document.createElement("button");
        addButton.textContent = "담기";
        addButton.addEventListener("click", makeAddHandler(course.id));
        row.appendChild(addButton);

        listArea.appendChild(row);
      }
    }

    // 장바구니 조회
    function loadCart() {
      sendRequest("GET", "/api/cart?nickname=" + encodeURIComponent(nickname), null)
        .then(function (result) {
          if (!result.ok) {
            showMessage(result.data.message, true);
            return;
          }
          renderCart(result.data);
        })
        .catch(function (error) {
          showMessage("서버에 연결할 수 없습니다: " + error, true);
        });
    }

    // 전체 과목 조회
    function loadCourses() {
      sendRequest("GET", "/api/courses", null)
        .then(function (result) {
          if (!result.ok) {
            showMessage("과목 목록을 불러오지 못했습니다.", true);
            return;
          }
          renderCourseList(result.data);
        })
        .catch(function (error) {
          showMessage("서버에 연결할 수 없습니다: " + error, true);
        });
    }

    // 담기 / 빼기 공통 처리: 성공하면 응답으로 받은 장바구니로 화면을 갱신
    function changeCart(method, courseId) {
      sendRequest(method, "/api/cart", { nickname: nickname, courseId: courseId })
        .then(function (result) {
          showMessage(result.data.message, !result.ok);
          if (result.ok) {
            renderCart(result.data);
          }
        })
        .catch(function (error) {
          showMessage("서버에 연결할 수 없습니다: " + error, true);
        });
    }

    // 반복문 안에서 버튼마다 자기 과목 ID를 기억하도록 함수로 감싸서 반환
    function makeAddHandler(courseId) {
      return function () {
        changeCart("POST", courseId);
      };
    }

    function makeRemoveHandler(courseId) {
      return function () {
        changeCart("DELETE", courseId);
      };
    }

    // 화면이 열리면 장바구니와 전체 과목을 불러옴
    loadCart();
    loadCourses();
  </script>
</body>
</html>
