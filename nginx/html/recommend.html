<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시간표 추천</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; }
    fieldset { margin-bottom: 12px; }
    .message { margin: 12px 0; font-weight: bold; }
    .error { color: #c0392b; }
    .combination { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
    .add-result { font-size: 14px; margin-top: 8px; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { border: 1px solid #ddd; text-align: center; padding: 4px; font-size: 13px; height: 28px; }
    td.filled { background: #dbe8ff; }
  </style>
</head>
<body>
  <h1>시간표 추천</h1>
  <!-- 현재 닉네임 표시 -->
  <p>닉네임: <strong id="nickname-label"></strong> · <a href="index.html">닉네임 변경</a> · <a href="cart.html">장바구니 보기</a></p>

  <!-- 추천 조건 입력 -->
  <fieldset>
    <legend>목표 학점</legend>
    <input type="number" id="target-credit" value="15" min="2" max="21">
  </fieldset>

  <fieldset>
    <legend>공강 요일</legend>
    <label><input type="checkbox" name="off-day" value="월"> 월</label>
    <label><input type="checkbox" name="off-day" value="화"> 화</label>
    <label><input type="checkbox" name="off-day" value="수"> 수</label>
    <label><input type="checkbox" name="off-day" value="목"> 목</label>
    <label><input type="checkbox" name="off-day" value="금"> 금</label>
  </fieldset>

  <fieldset>
    <legend>기타 조건</legend>
    <label><input type="checkbox" id="no-morning"> 오전 수업 제외 (1~3교시)</label>
  </fieldset>

  <button id="recommend-btn">추천받기</button>

  <!-- 결과 표시 영역 -->
  <div id="message" class="message"></div>
  <div id="result"></div>

  <script>
    var DAYS = ["월", "화", "수", "목", "금"];
    var MAX_PERIOD = 9;
    var NICKNAME_KEY = "nickname";

    // 저장된 닉네임 읽기 (없으면 빈 문자열)
    function loadNickname() {
      try {
        var saved = localStorage.getItem(NICKNAME_KEY);
        if (saved === null) {
          return "";
        }
        return saved;
      } catch (error) {
        return "";
      }
    }

    // 닉네임이 없으면 입장 화면으로 돌려보냄
    var nickname = loadNickname();
    if (nickname === "") {
      window.location.href = "index.html";
    }
    document.getElementById("nickname-label").textContent = nickname;

    // 체크된 공강 요일만 배열로 모음
    function getCheckedOffDays() {
      var boxes = document.querySelectorAll("input[name=off-day]");
      var days = [];
      for (var i = 0; i < boxes.length; i++) {
        if (boxes[i].checked) {
          days.push(boxes[i].value);
        }
      }
      return days;
    }

    // 특정 요일·교시에 수업이 있는 과목을 찾아 이름을 반환 (없으면 빈 문자열)
    function findCourseName(courses, day, period) {
      for (var i = 0; i < courses.length; i++) {
        var times = courses[i].times;
        for (var j = 0; j < times.length; j++) {
          if (times[j].day === day && times[j].start <= period && period <= times[j].end) {
            return courses[i].name;
          }
        }
      }
      return "";
    }

    // 조합 하나를 요일 x 교시 표로 그림
    function createTimetable(courses) {
      var table = document.createElement("table");

      // 머리글 줄: 교시, 월, 화, 수, 목, 금
      var headerRow = document.createElement("tr");
      var corner = document.createElement("th");
      corner.textContent = "교시";
      headerRow.appendChild(corner);
      for (var d = 0; d < DAYS.length; d++) {
        var dayHeader = document.createElement("th");
        dayHeader.textContent = DAYS[d];
        headerRow.appendChild(dayHeader);
      }
      table.appendChild(headerRow);

      // 1~9교시 줄
      for (var period = 1; period <= MAX_PERIOD; period++) {
        var row = document.createElement("tr");
        var periodCell = document.createElement("th");
        periodCell.textContent = period;
        row.appendChild(periodCell);

        for (var k = 0; k < DAYS.length; k++) {
          var cell = document.createElement("td");
          var name = findCourseName(courses, DAYS[k], period);
          if (name !== "") {
            cell.textContent = name;
            cell.className = "filled";
          }
          row.appendChild(cell);
        }
        table.appendChild(row);
      }
      return table;
    }

    // 조합의 과목을 하나씩 순서대로 장바구니에 담음
    // 한 과목이 실패해도(시간 겹침, 이미 담음 등) 나머지 과목은 계속 시도
    function addCombinationToCart(courses, resultArea) {
      var lines = [];

      // index번째 과목을 담고, 끝나면 다음 과목으로 넘어감
      function addNext(index) {
        if (index >= courses.length) {
          resultArea.innerHTML = lines.join("<br>");
          return;
        }

        var course = courses[index];
        fetch("/api/cart", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nickname: nickname, courseId: course.id })
        })
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (result.ok) {
              lines.push("✔ " + course.name + ": 담았습니다.");
            } else {
              lines.push("✖ " + course.name + ": " + result.data.message);
            }
            addNext(index + 1);
          })
          .catch(function (error) {
            lines.push("✖ " + course.name + ": 서버에 연결할 수 없습니다.");
            addNext(index + 1);
          });
      }

      resultArea.textContent = "담는 중...";
      addNext(0);
    }

    // 추천 결과 전체를 화면에 표시
    function renderResult(data) {
      var resultArea = document.getElementById("result");
      resultArea.innerHTML = "";

      for (var i = 0; i < data.combinations.length; i++) {
        var combination = data.combinations[i];

        var box = document.createElement("div");
        box.className = "combination";

        var title = document.createElement("h3");
        title.textContent = "추천 " + (i + 1) + " (총 " + combination.totalCredit + "학점)";
        box.appendChild(title);

        // 과목 이름 목록
        var list = document.createElement("ul");
        for (var j = 0; j < combination.courses.length; j++) {
          var course = combination.courses[j];
          var li = document.createElement("li");
          li.textContent = course.name + " (" + course.credit + "학점)";
          list.appendChild(li);
        }
        box.appendChild(list);

        // 시간표 표
        box.appendChild(createTimetable(combination.courses));

        // 장바구니 담기 버튼과 결과 표시 영역
        var addButton = document.createElement("button");
        addButton.textContent = "이 조합 장바구니에 담기";
        var addResult = document.createElement("div");
        addResult.className = "add-result";

        // 반복문 안에서 버튼마다 자기 조합을 기억하도록 함수로 감싸서 연결
        addButton.addEventListener("click", makeAddHandler(combination.courses, addResult));

        box.appendChild(addButton);
        box.appendChild(addResult);
        resultArea.appendChild(box);
      }
    }

    // 버튼 클릭 시 실행할 함수를 만들어 반환
    // var는 반복문 바깥까지 공유되므로, 이렇게 감싸지 않으면 모든 버튼이 마지막 조합을 담게 됨
    function makeAddHandler(courses, resultArea) {
      return function () {
        addCombinationToCart(courses, resultArea);
      };
    }

    // 메시지 표시 (오류면 빨간색)
    function showMessage(text, isError) {
      var messageArea = document.getElementById("message");
      messageArea.textContent = text;
      if (isError) {
        messageArea.className = "message error";
      } else {
        messageArea.className = "message";
      }
    }

    // 추천받기 버튼 클릭 시 서버에 요청
    function requestRecommend() {
      var body = {
        targetCredit: Number(document.getElementById("target-credit").value),
        offDays: getCheckedOffDays(),
        noMorning: document.getElementById("no-morning").checked
      };

      fetch("/api/recommend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      })
        .then(function (response) {
          // 상태 코드와 본문을 함께 넘기기 위해 묶어서 반환
          return response.json().then(function (data) {
            return { ok: response.ok, data: data };
          });
        })
        .then(function (result) {
          // 400 오류: 입력값 문제
          if (!result.ok) {
            document.getElementById("result").innerHTML = "";
            showMessage(result.data.message, true);
            return;
          }
          // 조합이 없으면 안내만, 있으면 결과 표시
          showMessage(result.data.message, result.data.count === 0);
          renderResult(result.data);
        })
        .catch(function (error) {
          showMessage("서버에 연결할 수 없습니다: " + error, true);
        });
    }

    document.getElementById("recommend-btn").addEventListener("click", requestRecommend);
  </script>
</body>
</html>
