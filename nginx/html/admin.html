<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; }
    fieldset { margin-bottom: 16px; }
    fieldset:disabled { opacity: 0.5; }
    .status { font-size: 20px; font-weight: bold; margin: 8px 0; }
    .message { margin: 8px 0; }
    .error { color: #c0392b; font-weight: bold; }
    .verified { color: #1e7b34; font-weight: bold; }
  </style>
</head>
<body>
  <h1>관리자</h1>
  <p><a href="index.html">처음으로</a></p>

  <!-- 관리자 키 확인: 맞아야 아래 기능이 열림 -->
  <fieldset>
    <legend>관리자 인증</legend>
    <input type="password" id="admin-key" placeholder="관리자 키">
    <button id="verify-btn">확인</button>
    <div id="verify-message" class="message">관리자 키를 입력하고 [확인]을 눌러주세요.</div>
  </fieldset>

  <!-- 신청 오픈·마감·초기화 (인증 전에는 disabled로 잠김) -->
  <fieldset id="manage-section" disabled>
    <legend>신청 관리</legend>
    <div id="status" class="status">상태 확인 중...</div>
    <label>오픈까지 대기 시간(초, 0~60): <input type="number" id="delay" value="10" min="0" max="60"></label>
    <br><br>
    <button id="open-btn">오픈</button>
    <button id="close-btn">마감</button>
    <button id="reset-btn">초기화 (정원·신청 내역)</button>
    <div id="admin-message" class="message"></div>
  </fieldset>

  <script>
    // 인증에 성공한 관리자 키 (인증 전이면 빈 문자열)
    var verifiedKey = "";

    // 서버에 요청을 보내고 { ok, data } 형태로 결과를 돌려줌
    function sendRequest(method, url, body) {
      var options = { method: method, headers: { "Content-Type": "application/json" } };
      if (body !== null) {
        options.body = JSON.stringify(body);
      }
      return fetch(url, options).then(function (response) {
        return response.json().then(function (data) {
          return { ok: response.ok, data: data };
        });
      });
    }

    // 관리 기능 잠금 / 해제
    // fieldset에 disabled를 주면 그 안의 입력칸과 버튼이 모두 비활성화됨
    function setLocked(locked) {
      document.getElementById("manage-section").disabled = locked;
    }

    // 인증 메시지 표시 (className으로 색상 결정)
    function showVerifyMessage(text, className) {
      var area = document.getElementById("verify-message");
      area.textContent = text;
      area.className = "message " + className;
    }

    // [확인] 버튼: 서버에 키가 맞는지 물어봄
    function verifyAdmin() {
      var key = document.getElementById("admin-key").value;

      if (key === "") {
        showVerifyMessage("관리자 키를 입력해주세요.", "error");
        return;
      }

      sendRequest("POST", "/api/admin/verify", { adminKey: key })
        .then(function (result) {
          if (result.ok) {
            // 맞으면 키를 기억하고 관리 기능 잠금 해제
            verifiedKey = key;
            setLocked(false);
            showVerifyMessage("관리자 인증 완료", "verified");
          } else {
            // 틀리면 잠금 유지
            verifiedKey = "";
            setLocked(true);
            showVerifyMessage(result.data.message, "error");
          }
        })
        .catch(function (error) {
          showVerifyMessage("서버에 연결할 수 없습니다: " + error, "error");
        });
    }

    // 인증 후 키 입력칸을 고치면 다시 잠금 (다시 확인해야 함)
    function onKeyInputChanged() {
      if (verifiedKey !== "") {
        verifiedKey = "";
        setLocked(true);
        showVerifyMessage("키가 바뀌었습니다. 다시 [확인]을 눌러주세요.", "");
      }
    }

    // 관리 결과 메시지 표시 (오류면 빨간색)
    function showAdminMessage(text, isError) {
      var area = document.getElementById("admin-message");
      area.textContent = text;
      if (isError) {
        area.className = "message error";
      } else {
        area.className = "message";
      }
    }

    // 신청 상태 표시 (1초마다 갱신)
    function loadStatus() {
      sendRequest("GET", "/api/status", null)
        .then(function (result) {
          var data = result.data;
          var text = "";
          if (data.state === "open") {
            text = "현재 상태: 신청 가능";
          } else if (data.state === "waiting") {
            text = "현재 상태: 오픈까지 " + data.remainingSeconds + "초";
          } else {
            text = "현재 상태: 마감";
          }
          document.getElementById("status").textContent = text;
        });
    }

    // 관리자 API 공통 호출 (인증된 키를 함께 보냄)
    function callAdmin(url, body) {
      sendRequest("POST", url, body)
        .then(function (result) {
          showAdminMessage(result.data.message, !result.ok);
          loadStatus();
        })
        .catch(function (error) {
          showAdminMessage("서버에 연결할 수 없습니다: " + error, true);
        });
    }

    function openEnroll() {
      callAdmin("/api/admin/open", { adminKey: verifiedKey, delaySeconds: Number(document.getElementById("delay").value) });
    }

    function closeEnroll() {
      callAdmin("/api/admin/close", { adminKey: verifiedKey });
    }

    function resetEnroll() {
      if (!confirm("모든 정원과 신청 내역을 초기화할까요?")) {
        return;
      }
      callAdmin("/api/admin/reset", { adminKey: verifiedKey });
    }

    document.getElementById("verify-btn").addEventListener("click", verifyAdmin);
    document.getElementById("admin-key").addEventListener("input", onKeyInputChanged);
    // 키 입력칸에서 Enter를 눌러도 확인되게 함
    document.getElementById("admin-key").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        verifyAdmin();
      }
    });
    document.getElementById("open-btn").addEventListener("click", openEnroll);
    document.getElementById("close-btn").addEventListener("click", closeEnroll);
    document.getElementById("reset-btn").addEventListener("click", resetEnroll);

    loadStatus();
    setInterval(loadStatus, 1000);
  </script>
</body>
</html>
