<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>수강신청 연습</title>
</head>
<body>
  <h1>수강신청 연습 사이트</h1>
  3. index.html에 링크 추가

<h1> 아래에 한 줄 추가합니다.

html
<!-- 시간표 추천 화면으로 이동 -->
<p><a href="recommend.html">시간표 추천받기</a></p>
  <button id="health-btn">서버 상태 확인</button>
  <pre id="health-result"></pre>

  <script>
    var button = document.getElementById("health-btn");
    var output = document.getElementById("health-result");

    button.addEventListener("click", function () {
      fetch("/api/health")
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          output.textContent = JSON.stringify(data, null, 2);
        })
        .catch(function (error) {
          output.textContent = "요청 실패: " + error;
        });
    });
  </script>
</body>
</html>
